name: Monitor Camisa Insider

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run monitor
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python monitor_camisa_insider.py
