name: Monitor Estilingue

on:
  schedule:
    - cron: '0 11 * * *'   # Todo dia às 8h de Brasília
  workflow_dispatch:       # Permite rodar manualmente

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Run monitor
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python monitor_estilingue.py
