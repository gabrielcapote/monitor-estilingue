name: Monitor Broche Coexist

on:
  schedule:
    - cron: '0 9 * * *'   # Roda todo dia às 9h da manhã
  workflow_dispatch:      # Permite rodar manualmente

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run monitor
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: python monitor_broche.py
